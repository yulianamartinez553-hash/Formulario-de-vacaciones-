<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RRHH privado · PDF Licencia — Servinorte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Semi+Condensed:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://www.gstatic.com/charts/loader.js"></script>
<style>
  :root{
    --azul-primario:#1F3C8C; --azul-profundo:#14295E;
    --gris-texto:#2B2B2B; --gris-suave:#5A5A5A;
    --resaltado:rgba(31,60,140,.10);
    --membrete:url("/membrete-servinorte.png");
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#5b6478;font-family:'Barlow',sans-serif;color:var(--gris-texto);-webkit-font-smoothing:antialiased;}

  .page{
    width:210mm;height:297mm;margin:16px auto;position:relative;overflow:hidden;
    background:#fff var(--membrete) center/100% 100% no-repeat;
    box-shadow:0 18px 50px rgba(0,0,0,.35);
  }
  .content{
    position:absolute;top:40mm;left:0;right:0;z-index:1;
    display:flex;justify-content:center;
  }
  .doc{
    width:min(148mm, calc(100% - 36mm));
    max-width:148mm;
  }

  .copia{display:flex;justify-content:flex-end;margin-bottom:10px;}
  .copia .tag{font-family:'Oswald',sans-serif;font-size:10px;letter-spacing:2px;text-transform:uppercase;
    border:1.5px solid var(--azul-primario);color:var(--azul-primario);padding:4px 10px;border-radius:3px;}
  .copia .tag.fill{background:var(--azul-primario);color:#fff;}

  .doc-title{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:2.5px;font-size:13.5px;
    color:var(--azul-primario);text-transform:uppercase;text-align:center;margin-bottom:14px;}
  .doc-title i{display:block;height:2px;width:48px;background:var(--azul-primario);margin:7px auto 0;}

  .fecha{text-align:right;font-size:13.5px;margin-bottom:12px;line-height:1.45;}
  .legajo,.dest,.puesto{font-family:'Barlow Semi Condensed',sans-serif;font-size:14px;margin-bottom:3px;line-height:1.4;}
  .legajo{margin-top:21mm;}
  .legajo .k,.dest .k,.puesto .k{font-weight:600;letter-spacing:.4px;color:var(--azul-profundo);}
  .dest .v{font-weight:600;color:#111;}
  .puesto{margin-bottom:14px;}

  .parrafo{font-size:13.5px;line-height:1.75;text-align:justify;color:#222;margin:0 auto 16px;text-indent:0;max-width:100%;}
  .campo{display:inline-block;background:var(--resaltado);color:#111;font-weight:700;
    text-align:center;min-width:2.6em;padding:1px 8px;margin:0 2px;border-radius:3px;
    line-height:1.35;white-space:nowrap;vertical-align:baseline;}
  .nota{font-size:12px;color:var(--gris-suave);line-height:1.55;margin:4px auto 0;text-align:justify;}
  .tramo{font-size:13.5px;line-height:1.55;text-align:justify;color:#222;margin:14px auto 0;}

  .firmas{display:flex;gap:48px;margin:72px 0 0;align-items:flex-start;justify-content:space-between;width:100%;max-width:100%;}
  .firma{flex:0 1 40%;max-width:none;text-align:center;}
  .firma .linea{border-top:1.4px solid #4a4a4a;margin:36px 10px 6px;height:0;}
  .firma .rot{font-family:'Barlow Semi Condensed',sans-serif;font-size:12.5px;color:#333;letter-spacing:.3px;margin-bottom:4px;}
  .acl{display:flex;gap:6px;align-items:flex-end;margin-top:8px;
    font-family:'Barlow Semi Condensed',sans-serif;font-size:11.5px;color:#444;}
  .acl .lbl{white-space:nowrap;}
  .acl .fill{flex:1;border-bottom:1px solid #9aa3b2;height:1.05em;}

  .toolbar{max-width:210mm;margin:8px auto 0;display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:wrap;padding:0 8px;}
  .toolbar .logo{width:42px;height:42px;object-fit:contain;border-radius:8px;background:#fff;padding:3px;}
  .estado{font-family:'Barlow',sans-serif;font-size:13px;color:#e7ecf6;flex:1;min-width:180px;max-width:420px;}
  .estado.ok{color:#b6f0c4;} .estado.err{color:#ffc9c9;} .estado.warn{color:#ffe6a7;}
  .btn{font-family:'Oswald',sans-serif;letter-spacing:1px;font-size:12.5px;text-transform:uppercase;
    background:#fff;color:var(--azul-primario);border:1.5px solid var(--azul-primario);
    padding:9px 16px;border-radius:6px;cursor:pointer;}
  .btn.solid{background:var(--azul-primario);color:#fff;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  /* Export / print: cada .page = exactamente 1 A4 */
  body.pdf-export{
    background:#fff!important;
  }
  body.pdf-export .toolbar,
  body.pdf-export .no-print,
  body.pdf-export .gate{
    display:none!important;
  }
  body.pdf-export #hojas{
    margin:0!important;padding:0!important;width:210mm;
  }
  body.pdf-export .page{
    margin:0!important;padding:0!important;box-shadow:none!important;
    width:210mm!important;height:297mm!important;max-height:297mm!important;
    overflow:hidden!important;page-break-after:always;break-after:page;
    page-break-inside:avoid;break-inside:avoid;
  }
  body.pdf-export .page:last-child{
    page-break-after:auto!important;break-after:auto!important;
  }

  @page{size:A4;margin:0;}
  @media print{
    html,body{
      margin:0!important;padding:0!important;background:#fff!important;
      width:210mm!important;min-height:0!important;
    }
    .toolbar,.no-print,.gate{display:none!important;}
    .app-shell{display:block!important;margin:0!important;padding:0!important;}
    #hojas{margin:0!important;padding:0!important;width:210mm!important;}
    .page{
      margin:0!important;padding:0!important;border:0!important;box-shadow:none!important;
      width:210mm!important;height:297mm!important;max-height:297mm!important;
      overflow:hidden!important;
      page-break-after:always!important;break-after:page!important;
      page-break-before:auto!important;
      page-break-inside:avoid!important;break-inside:avoid!important;
    }
    .page:last-child{
      page-break-after:auto!important;break-after:auto!important;
    }
    *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}
  }

  .gate{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#14295E,#1F3C8C 55%,#3a5bb5);
    display:flex;align-items:center;justify-content:center;padding:24px;}
  .gate[hidden]{display:none!important;}
  .gate-card{width:min(420px,100%);background:#fff;border-radius:16px;padding:28px 26px 24px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);color:#222;}
  .gate-card img{width:64px;height:64px;object-fit:contain;display:block;margin:0 auto 12px;border-radius:12px;}
  .gate-card h1{font-family:'Oswald',sans-serif;letter-spacing:1px;font-size:22px;text-align:center;
    text-transform:uppercase;color:#14295E;margin-bottom:6px;}
  .gate-card p{text-align:center;color:#5A5A5A;font-size:14px;margin-bottom:18px;line-height:1.45;}
  .gate-card label{display:block;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:#5A5A5A;margin-bottom:6px;}
  .gate-card input{width:100%;font:inherit;font-size:16px;padding:12px 12px;border:1.5px solid #d5dbe8;
    border-radius:10px;margin-bottom:12px;}
  .gate-card .err{color:#b52a2a;font-size:13px;min-height:1.2em;margin-bottom:8px;}
  .gate-card .btn{width:100%;text-align:center;}
  .app-shell[hidden]{display:none!important;}

</style>
</head>
<body>

<div class="gate" id="gate">
  <form class="gate-card" id="gateForm" autocomplete="on">
    <img src="/logo-servinorte.jfif" alt="Servinorte">
    <h1>RRHH · Formulario PDF</h1>
    <p>Versión <b>v2026-08-05w</b> · Firmas: Encargado de Área + Empleado · Pendientes en 0</p>
    <p>Ingresá la clave para generar el PDF con los datos de la última solicitud de REGISTRO.</p>
    <label for="clave">Clave de acceso</label>
    <input id="clave" name="password" type="password" placeholder="Clave RRHH" required>
    <div class="err" id="gateErr"></div>
    <button class="btn solid" type="submit">Entrar y cargar formulario</button>
  </form>
</div>

<div class="app-shell" id="appShell" hidden>
<div class="toolbar no-print">
  <img class="logo" src="/logo-servinorte.jfif" alt="Servinorte SRL" width="42" height="42">
  <span class="estado" id="estado">RRHH · PDF licencia (última de REGISTRO)…</span>
  <button class="btn" id="btnReg" onclick="cargarDesdeRegistro()">Actualizar desde REGISTRO</button>
  <button class="btn solid" id="btnPdf" onclick="descargarPDF()">Descargar PDF</button>
  <button class="btn" onclick="imprimirHojas()">Imprimir</button>
</div>

<div id="hojas"></div>
</div><!-- /app-shell -->

<script>

const RRHH_CLAVE = "ServinorteRRHH2026";
const RRHH_KEY = "servinorte_rrhh_ok";

function desbloquearRRHH(){
  document.getElementById('gate').hidden = true;
  document.getElementById('appShell').hidden = false;
  iniciar();
}

function setupGate(){
  const form = document.getElementById('gateForm');
  const err = document.getElementById('gateErr');
  if(sessionStorage.getItem(RRHH_KEY) === '1'){
    desbloquearRRHH();
    return;
  }
  form.addEventListener('submit', (ev)=>{
    ev.preventDefault();
    const v = (document.getElementById('clave').value || '').trim();
    if(v === RRHH_CLAVE){
      sessionStorage.setItem(RRHH_KEY, '1');
      err.textContent = '';
      desbloquearRRHH();
    } else {
      err.textContent = 'Clave incorrecta. Probá de nuevo.';
    }
  });
}

const CONFIG = {
  sheetId: "1aaWSfGKGIU1BhZqNjOgLPn2xC3mVp1gULvEXQvCWI_Q",
  hojaRegistro: "REGISTRO",
  /* Datos desde REGISTRO (última solicitud = primera fila con datos desde A4) */
  rangoRegistro: "A4:H80",
  ciudad: "Ciudad de Salta",
  appsScriptUrl: "https://script.google.com/macros/s/AKfycbwoADdM80IFTeDyZuOu6GWmjd1DFZSwrOSNJM8yZd1ENxk9UjsOFTl-DPQUi2myOphc/exec"
};

const COPIAS = [
  {tag:"Original · Empleado", fill:true},
  {tag:"Duplicado · Empresa", fill:false}
];
const FIRMAS = ["Encargado de Área","Firma del Empleado"];

let campos = {
  ciudad: CONFIG.ciudad,
  fecha: fechaHoy(),
  legajo: "—",
  nombre: "—",
  puesto: "—",
  fechaInicio: "—",
  fechaFin: "—",
  fechaRetorno: "—",
  diasTomados: "—",
  diasPendientes: "0",
  periodoPendiente: "—",
  anioLicencia: "—",
  estado: ""
};

let enviado = false;

function fechaHoy(){
  return new Date().toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'});
}
function fmtFecha(d){ return d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear(); }
function parseFecha(v){
  if(v instanceof Date) return v;
  const m=String(v||"").trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if(m){ let a=+m[3]; if(a<100)a+=2000; return new Date(a,(+m[2])-1,+m[1]); }
  return null;
}
function retornoDesdeFin(v){
  const d=parseFecha(v); if(!d) return "—";
  d.setDate(d.getDate()+1); return fmtFecha(d);
}
function esc(s){
  return String(s??"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function bloqueFirma(rot){
  return `<div class="firma">
      <div class="linea"></div><div class="rot">${esc(rot)}</div>
      <div class="acl"><span class="lbl">Aclaración:</span><span class="fill"></span></div>
      <div class="acl"><span class="lbl">Fecha:</span><span class="fill"></span></div>
    </div>`;
}

function render(){
  const cont=document.getElementById('hojas'); cont.innerHTML="";
  COPIAS.forEach(c=>{
    const page=document.createElement('div'); page.className='page';
    // Fondo inline (html2canvas no resuelve bien var(--membrete))
    try{
      const mem=getComputedStyle(document.documentElement).getPropertyValue('--membrete').trim();
      if(mem) page.style.background='#fff '+mem+' center/100% 100% no-repeat';
    }catch(_e){}
    page.innerHTML=`
      <div class="content">
        <div class="doc">
          <div class="copia"><span class="tag ${c.fill?'fill':''}">${esc(c.tag)}</span></div>
          <p class="fecha"><span class="campo">${esc(campos.ciudad)}</span>, <span class="campo">${esc(campos.fecha)}</span></p>

          <p class="legajo"><span class="k">LEG</span>&nbsp;&nbsp;<span>${esc(campos.legajo)}</span></p>
          <p class="dest"><span class="k">SEÑOR:</span>&nbsp;&nbsp;<span class="v">${esc(campos.nombre)}</span></p>
          <p class="puesto"><span class="k">PUESTO:</span>&nbsp;&nbsp;<span>${esc(campos.puesto)}</span></p>

          <p class="parrafo">
            Comunicamos a Ud. que su licencia anual correspondiente al año
            <span class="campo">${esc(campos.anioLicencia)}</span> ha sido diagramada para iniciarla el día
            <span class="campo">${esc(campos.fechaInicio)}</span>, concluyendo la misma el día
            <span class="campo">${esc(campos.fechaFin)}</span>, debiendo retomar sus tareas habituales el día
            <span class="campo">${esc(campos.fechaRetorno)}</span>.-
          </p>
          <p class="parrafo">
            Asimismo dejamos constancia que por el período
            <span class="campo">${esc(campos.periodoPendiente)}</span> quedan pendientes
            <span class="campo">${esc(campos.diasPendientes)}</span> días de su Licencia Anual Ordinaria.
          </p>
          <p class="tramo">Días solicitados en este tramo: <span class="campo">${esc(campos.diasTomados)}</span>.</p>
          <p class="nota">Los mencionados días serán otorgados de acuerdo a las normativas legales laborales vigentes.</p>

          <div class="firmas">${FIRMAS.map(bloqueFirma).join("")}</div>
        </div>
      </div>`;
    cont.appendChild(page);
  });
  document.title="Licencia Anual — "+campos.nombre;
}

function setEstado(t,cls){
  const e=document.getElementById('estado');
  e.textContent=t; e.className='estado'+(cls?(' '+cls):'');
}

function aplicarCampos(data, origen){
  campos.legajo = data.leg || "—";
  campos.nombre = (data.empleado || "—").toUpperCase();
  campos.puesto = data.puesto || "—";
  campos.fechaInicio = data.desde || "—";
  campos.fechaFin = data.hasta || "—";
  campos.fechaRetorno = retornoDesdeFin(data.hasta);
  campos.diasTomados = data.dias != null && data.dias !== "" ? String(data.dias) : "—";
  campos.diasPendientes = pendDisplay(data.pend);
  campos.periodoPendiente = data.periodo || "—";
  campos.anioLicencia = data.periodo || "—";
  campos.estado = data.estado || "";
  campos.fecha = fechaHoy();
  render();
  const est = campos.estado ? ` · Estado: ${campos.estado}` : "";
  setEstado(`Autocompletado desde ${origen}${est}. Descargá PDF o imprimí.`,"ok");
  const be=document.getElementById('btnEnviar'); if(be) be.disabled=false;
  enviado = false;
}

function datosDesdeURL(){
  const q = new URLSearchParams(location.search);
  const data = {
    leg: (q.get('leg')||q.get('LEG')||q.get('legajo')||"").trim(),
    empleado: (q.get('emp')||q.get('empleado')||q.get('EMPLEADO')||q.get('nombre')||"").trim(),
    puesto: (q.get('puesto')||q.get('PUESTO')||"").trim(),
    desde: (q.get('desde')||q.get('DESDE')||"").trim(),
    hasta: (q.get('hasta')||q.get('HASTA')||"").trim(),
    dias: (q.get('dias')||q.get('DIAS')||"").trim(),
    periodo: (q.get('per')||q.get('periodo')||q.get('PERIODO')||"").trim(),
    estado: (q.get('estado')||q.get('ESTADO')||"").trim(),
    pend: (q.get('pend')||"").trim()
  };
  if(!data.empleado && !data.leg) return null;
  return data;
}

function cellText(dt,r,c){
  const formatted = (dt.getFormattedValue(r,c)||"").trim();
  if(formatted) return formatted;
  const v = dt.getValue(r,c);
  if(v==null || v==="") return "";
  if(v instanceof Date) return fmtFecha(v);
  return String(v).trim();
}

function normName(s){
  return String(s||"").normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
}

function pendDisplay(v){
  const raw = v == null ? "" : String(v).trim();
  if(!raw || raw === "-" || raw === "—" || raw.toLowerCase() === "n/a" || raw === "***") return "0";
  const n = parseInt(raw.replace(/[^\d-]/g,''), 10);
  if(!isNaN(n) && n < 0) return "0";
  return raw;
}

/** Busca en CONTROL los días pendientes del período para ese legajo/nombre. */
function buscarPendientesControl(leg, empleado, periodo, cb){
  const per = String(periodo||"").trim();
  const idx = ({"2023":2,"2024":3,"2025":4,"2026":5})[per];
  if(idx == null){ cb("0"); return; }
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq`
    + `?sheet=${encodeURIComponent("CONTROL")}&headers=0&range=${encodeURIComponent("A3:F")}`;
  const query = new google.visualization.Query(url);
  query.send(resp=>{
    if(resp.isError()){ cb("0"); return; }
    const dt = resp.getDataTable();
    const wantLeg = String(leg||"").trim();
    const wantNom = normName(empleado);
    let found = "";
    for(let r=0;r<dt.getNumberOfRows();r++){
      const l = cellText(dt,r,0);
      const n = cellText(dt,r,1);
      if(!l || !n || normName(n)==="EMPLEADOS") continue;
      if((wantLeg && l === wantLeg && (!wantNom || normName(n)===wantNom || normName(n).includes(wantNom.slice(0,10))))
        || (!wantLeg && wantNom && normName(n)===wantNom)
        || (wantNom && normName(n)===wantNom)){
        // Prefer exact name match; allow leg match for Servinorte
        if(wantNom && normName(n)===wantNom){ found = cellText(dt,r,idx); break; }
        if(!found && wantLeg && l === wantLeg) found = cellText(dt,r,idx);
      }
    }
    cb(pendDisplay(found));
  });
}

function cargarDesdeRegistro(){
  setEstado("Leyendo última solicitud de REGISTRO…");
  // Leemos varias filas por si quedaron vacías arriba; tomamos la primera con datos
  const rango = "A4:H80";
  const url = `https://docs.google.com/spreadsheets/d/${CONFIG.sheetId}/gviz/tq`
    + `?sheet=${encodeURIComponent(CONFIG.hojaRegistro)}&headers=0&range=${encodeURIComponent(rango)}`;
  const query = new google.visualization.Query(url);
  query.send(resp=>{
    if(resp.isError()){
      setEstado("No se pudo leer REGISTRO. Verificá que la planilla sea pública (Lector).","err");
      return;
    }
    const dt = resp.getDataTable();
    if(!dt || dt.getNumberOfRows()<1){
      setEstado("REGISTRO no tiene filas de datos.","err");
      return;
    }
    let data = null;
    for(let r=0; r<dt.getNumberOfRows(); r++){
      const empleado = cellText(dt,r,1);
      const leg = cellText(dt,r,0);
      if(!empleado && !leg) continue;
      // A=LEG B=EMPLEADO C=PUESTO D=DESDE E=HASTA F=DIAS G=PERIODO H=ESTADO
      data = {
        leg: leg,
        empleado: empleado,
        puesto: cellText(dt,r,2),
        desde: cellText(dt,r,3),
        hasta: cellText(dt,r,4),
        dias: cellText(dt,r,5),
        periodo: cellText(dt,r,6),
        estado: cellText(dt,r,7),
        pend: ""
      };
      break;
    }
    if(!data){
      setEstado("No hay solicitudes con datos en REGISTRO.","err");
      return;
    }
    // Primero pinta con 0; luego completa pendientes reales desde CONTROL
    data.pend = data.pend || "0";
    aplicarCampos(data, "última fila de REGISTRO");
    buscarPendientesControl(data.leg, data.empleado, data.periodo, (pend)=>{
      campos.diasPendientes = pendDisplay(pend);
      render();
      setEstado(`Autocompletado desde última fila de REGISTRO · Pendientes ${campos.diasPendientes}. Descargá PDF o imprimí.`,"ok");
    });
  });
}

function getMembreteUrl(){
  const raw=getComputedStyle(document.documentElement).getPropertyValue('--membrete').trim();
  const m=raw.match(/url\(["']?(.+?)["']?\)/i);
  return m ? m[1] : '/membrete-servinorte.png';
}

async function preloadImage(src){
  await new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>resolve(img);
    img.onerror=()=>reject(new Error('No se pudo cargar el membrete'));
    img.src=src;
  });
}

async function getPdfLibs(){
  const h2c=window.html2canvas;
  const JsPDF=(window.jspdf && window.jspdf.jsPDF) || window.jsPDF || null;
  if(h2c && JsPDF) return {h2c, JsPDF};
  await new Promise(r=>setTimeout(r,400));
  return {
    h2c: window.html2canvas,
    JsPDF: (window.jspdf && window.jspdf.jsPDF) || window.jsPDF || null
  };
}

function triggerBlobDownload(blob, filename){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=filename;
  a.rel='noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2500);
}

async function capturePage(h2c, page, membreteUrl){
  const host=document.createElement('div');
  host.setAttribute('data-pdf-capture','1');
  host.style.cssText='position:fixed;left:-12000px;top:0;width:794px;height:1123px;overflow:hidden;background:#fff;z-index:0;';
  const clone=page.cloneNode(true);
  clone.style.cssText='margin:0;box-shadow:none;width:794px;height:1123px;max-height:1123px;overflow:hidden;position:relative;background:#fff;';
  // Imagen de membrete real (más fiable que background CSS en html2canvas)
  const bg=document.createElement('img');
  bg.src=membreteUrl;
  bg.alt='';
  bg.style.cssText='position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:0;pointer-events:none;';
  clone.insertBefore(bg, clone.firstChild);
  const content=clone.querySelector('.content');
  if(content) content.style.zIndex='1';
  host.appendChild(clone);
  document.body.appendChild(host);
  try{
    await preloadImage(membreteUrl);
    await new Promise(r=>setTimeout(r,30));
    return await h2c(clone,{
      scale:1.5,
      useCORS:true,
      allowTaint:true,
      backgroundColor:'#ffffff',
      logging:false,
      width:794,
      height:1123,
      windowWidth:794,
      windowHeight:1123,
      scrollX:0,
      scrollY:0,
      x:0,
      y:0
    });
  }finally{
    host.remove();
  }
}

async function descargarPDF(){
  const btn=document.getElementById('btnPdf');
  btn.disabled=true;
  setEstado("Generando PDF…");
  const pages=[...document.querySelectorAll('#hojas .page')];
  if(!pages.length){
    setEstado("No hay hojas para exportar.","err");
    btn.disabled=false;
    return;
  }

  const libs=await getPdfLibs();
  if(!libs.h2c || !libs.JsPDF){
    setEstado("No se cargaron las librerías PDF. Recargá la página (Ctrl+Shift+R) e intentá de nuevo.","err");
    btn.disabled=false;
    return;
  }

  try{
    const membreteUrl=getMembreteUrl();
    await preloadImage(membreteUrl);
    const pdf=new libs.JsPDF({unit:'mm', format:'a4', orientation:'portrait'});
    const nombre=(campos.nombre||"licencia").replace(/[^\wáéíóúñÁÉÍÓÚÑ]+/g,"_").slice(0,40);
    const filename=`Licencia_${nombre}_${campos.anioLicencia||""}.pdf`;

    for(let i=0;i<pages.length;i++){
      setEstado("Generando PDF… hoja "+(i+1)+"/"+pages.length);
      const canvas=await capturePage(libs.h2c, pages[i], membreteUrl);
      const img=canvas.toDataURL('image/jpeg',0.93);
      if(i>0) pdf.addPage();
      pdf.addImage(img,'JPEG',0,0,210,297);
    }

    triggerBlobDownload(pdf.output('blob'), filename);
    setEstado("PDF descargado ✓ ("+pages.length+" hojas)","ok");
  }catch(err){
    console.error('PDF error', err);
    setEstado("No se pudo generar el PDF: "+(err && err.message ? err.message : err)+". Usá Imprimir → Guardar como PDF.","err");
  }finally{
    btn.disabled=false;
  }
}

function imprimirHojas(){
  const pages=[...document.querySelectorAll('#hojas .page')];
  document.body.classList.add('pdf-export');
  const prevStyles=pages.map(p=>p.getAttribute('style'));
  pages.forEach(p=>{
    p.style.setProperty('margin','0','important');
    p.style.setProperty('box-shadow','none','important');
    p.style.setProperty('width','210mm','important');
    p.style.setProperty('height','297mm','important');
    p.style.setProperty('max-height','297mm','important');
    p.style.setProperty('overflow','hidden','important');
  });
  const cleanup=()=>{
    pages.forEach((p,i)=>{
      if(prevStyles[i]==null) p.removeAttribute('style');
      else p.setAttribute('style', prevStyles[i]);
    });
    document.body.classList.remove('pdf-export');
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  setTimeout(()=>{ window.print(); setTimeout(cleanup, 1500); }, 50);
}

function iniciar(){
  const fromUrl = datosDesdeURL();
  if(fromUrl){
    aplicarCampos(fromUrl, "datos por URL");
    return;
  }
  if(typeof google !== "undefined" && google.charts){
    google.charts.load('current');
    google.charts.setOnLoadCallback(cargarDesdeRegistro);
  } else {
    setEstado("Cargá la última solicitud desde REGISTRO.","warn");
    render();
  }
}
